services:
  db:
    image: postgres:16-alpine
    container_name: clipper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: clipper
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - clipper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clipper']
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  clipper_pgdata:
